<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Verdant Oak Creative logo">
  <title>Verdant Oak Creative</title>

  <!-- Background -->
  <rect width="100" height="100" rx="16" fill="#2C352A"/>

  <g fill="none" stroke="#8FAF6E" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===================== -->
    <!-- ACORN                 -->
    <!-- ===================== -->

    <!-- Stem -->
    <line x1="40" y1="35" x2="40" y2="27" stroke-width="1.8"/>

    <!-- Cap (half-ellipse, flat bottom aligns with body top) -->
    <path d="M 23,46 C 23,39.5 30.5,35 40,35 C 49.5,35 57,39.5 57,46 Z" stroke-width="1.8"/>

    <!-- Cap hatching – vertical lines only (no horizontal band, cleaner) -->
    <line x1="29"  y1="37.5" x2="26.5" y2="46" stroke-width="1.1" opacity="0.75"/>
    <line x1="34.5" y1="36"  x2="33"   y2="46" stroke-width="1.1" opacity="0.75"/>
    <line x1="40"  y1="35"  x2="40"   y2="46" stroke-width="1.1" opacity="0.75"/>
    <line x1="45.5" y1="36"  x2="47"   y2="46" stroke-width="1.1" opacity="0.75"/>
    <line x1="51"  y1="37.5" x2="53.5" y2="46" stroke-width="1.1" opacity="0.75"/>

    <!-- Body -->
    <path d="M 23,46 C 21,57 25.5,70 33.5,74.5 Q 40,77.5 46.5,74.5 C 54.5,70 59,57 57,46" stroke-width="1.8"/>

    <!-- Small nub at bottom tip of acorn -->
    <path d="M 38,75.5 Q 40,78.5 42,75.5" stroke-width="1.5"/>


    <!-- ===================== -->
    <!-- OAK LEAF              -->
    <!-- ===================== -->

    <!-- Stem: curves from acorn stem area up-right to leaf base -->
    <path d="M 40,27 C 50,21 60,23 67,29" stroke-width="1.7"/>

    <!-- Leaf silhouette (clockwise from stem, 3 lobes per side) -->
    <path d="
      M 67,29
      C 65.5,24.5 61,23 59.5,26.5
      C 58,22 53.5,21 52.5,25
      C 50,21 46,22.5 47,26.5
      C 44,24 41,27 43.5,30.5
      C 40.5,30 39.5,34 43,35.5
      C 40.5,37.5 41.5,42 45,41
      C 44,45 47.5,47.5 50.5,45.5
      C 50.5,49 54.5,50 55.5,47
      C 56.5,50 61,49.5 60.5,46
      C 63.5,48 67,45.5 65,42.5
      C 68.5,42 69.5,38 66.5,36.5
      C 70,35.5 70,31 67,29
      Z
    " stroke-width="1.8"/>

    <!-- Center leaf vein -->
    <path d="M 67,29 C 63,35.5 57,43.5 53,51" stroke-width="1.2" opacity="0.6"/>

    <!-- Two small secondary veins -->
    <path d="M 59,35 C 57,37 55,39 55,39" stroke-width="0.9" opacity="0.5"/>
    <path d="M 57,40 C 55,41.5 54,43 54,43"  stroke-width="0.9" opacity="0.5"/>

  </g>
</svg>
